<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalistenik"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kalistenik Antrenman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: tek sütun telefon uygulaması — üstte sabit gün sekmeleri, hareket listesi; hareket detayı tam ekran katman. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#121a22; --muted:#5b6876; --line:#d8dee4;
  --accent:#e0542a; --accent-ink:#ffffff; --stage:#f7f9fa; --ok:#2a8150; --far:#9aa7b4; --prop:#9aa4ad; --floor:#eef1f3; --boxc:#dde3e8; --towel:#d9913a;
  --r-omuz:#2a6f97; --r-karin:#7a3fa0; --r-sirt:#b06a12; --r-bacak:#2a8150; --r-gogus:#c0392b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#161e26; --ink:#e7ecf1; --muted:#93a0ad; --line:#26323d;
  --accent:#ff7a4d; --accent-ink:#1a0d07; --stage:#11181f; --ok:#6cc794; --far:#5f6c79; --prop:#56626e; --floor:#151d25; --boxc:#26313c; --towel:#c47f2c;
  --r-omuz:#6fb3db; --r-karin:#c08ae6; --r-sirt:#e6a24f; --r-bacak:#6cc794; --r-gogus:#f0796b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161e26; --ink:#e7ecf1; --muted:#93a0ad; --line:#26323d;
  --accent:#ff7a4d; --accent-ink:#1a0d07; --stage:#11181f; --ok:#6cc794; --far:#5f6c79; --prop:#56626e; --floor:#151d25; --boxc:#26313c; --towel:#c47f2c;
  --r-omuz:#6fb3db; --r-karin:#c08ae6; --r-sirt:#e6a24f; --r-bacak:#6cc794; --r-gogus:#f0796b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 8px}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 9px;font-weight:600;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:14px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.n{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);text-align:center;line-height:1}
.rmain{min-width:0}
.rtitle{font-weight:600;font-size:16px;line-height:1.25;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px;font-size:13px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
.go{color:var(--muted);font-size:20px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);margin:0}
.note b{color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.lvname{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;text-transform:uppercase;margin:0;text-wrap:balance}
.en{color:var(--muted);font-size:14px;margin:2px 0 0}
.vid{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;text-decoration:none}
.vid .play{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.vid .play::before{content:"";border-left:14px solid var(--accent-ink);border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.vid b{display:block;font-size:16px}
.vid small{opacity:.75;font-size:13px}
.vid.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.vid .play.web{background:var(--r-omuz)}
.vid .play.web::before{content:"↗";border:0;margin:0;color:#fff;font-weight:700;font-size:20px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos figure{margin:0;background:var(--stage);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.photos img{display:block;width:100%;height:auto}
.photos figcaption{font-size:12px;color:var(--muted);padding:4px 8px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:15px;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px;line-height:1.1}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ladder{display:flex;flex-direction:column}
.lv{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;font-size:15px}
.lv:last-child{border-bottom:0}
.lv b{font-family:var(--display);font-size:18px;color:var(--muted)}
.lv.cur b{color:var(--accent)}
.lv.view{background:var(--stage);border-radius:8px}
.lv em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.set.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.timer{font-family:var(--display);font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.timer.end{color:var(--accent)}
input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)}
.log{display:flex;flex-direction:column;gap:8px}
.logi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.logi small{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.status{font-size:12px;color:var(--muted)}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage .anim{aspect-ratio:4/3;width:100%}
.stage .anim svg{width:100%;height:100%;display:block}
.stage .cap{display:block;padding:8px 12px;font-size:14px;font-weight:600;min-height:2.4em;border-top:1px solid var(--line);background:var(--surface)}
.stage .tag{position:absolute;top:8px;left:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.start{width:100%;margin:4px 0 12px;font-size:18px;padding:14px}
.run{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.run .wrap{display:flex;flex-direction:column;gap:12px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.step{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sets.bigsets .set{width:56px;height:56px;font-size:18px}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;cursor:pointer;text-align:left}
.done-hero{font-family:var(--display);font-weight:700;font-size:40px;text-transform:uppercase;line-height:1;margin:20px 0 4px}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.plain>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.plain>div:last-child{border-bottom:0}
.plain .r{color:var(--muted);white-space:nowrap;display:flex;gap:10px;align-items:center}
.plain a{color:var(--accent);font-weight:600;text-decoration:none}
.plain .st{justify-content:flex-start}
.plain .st .nm{flex:1;min-width:0}
.mini{flex:0 0 auto;width:88px;aspect-ratio:4/3;background:var(--stage);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini svg{width:100%;height:100%;display:block}
.week{display:flex;gap:6px;align-items:center;margin:0 0 12px;font-size:13px;color:var(--muted)}
.wk{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-weight:600;color:var(--muted)}
.wk.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.wk.today{border-color:var(--ink);color:var(--ink)}
.rule{font-size:13px;color:var(--muted);margin:8px 0 0}
.holdbtn{width:100%;margin-top:12px;font-size:18px;padding:14px;background:var(--ink);color:var(--bg)}
.holdbtn.on{background:var(--accent);color:var(--accent-ink)}
.holds{font-size:14px;color:var(--muted);margin:8px 0 0;text-align:center}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock{margin-left:auto;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <p class="brand">Kalistenik <span>3 gün</span></p>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="run" id="run" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script>
const LADDERS={
 HS:{name:'Handstand',levels:[
  {tr:'Ayaklar kutuda pike handstand',en:'Box pike handstand hold',type:'hold',key:'box pike handstand hold',

  {tr:'Duvara dönük omuz dokunuşu',en:'Chest-to-wall shoulder taps',type:'reps',key:'chest-to-wall shoulder taps or single leg off wall',

  {tr:'Toe pull (duvardan ayrılma)',en:'Handstand toe pulls',type:'reps',key:'toe pulls',

  {tr:'Duvarsız kick-up',en:'Handstand kick up',type:'reps',key:'handstand kick up',

  {tr:'Serbest handstand tutuş',en:'Freestanding handstand hold',type:'hold',key:'freestanding handstand hold/balance tips',
   how:['Kick-up ile çık, vücut tek çizgi.','Öne düşüyorsan parmak uçlarına bas, geriye düşüyorsan avuca yüklen.','Süre biriktir: 10 × 5-10 sn denemeler.']},
 ]},
 COMP:{name:'Compression (bacak kaldırma)',levels:[
  {tr:'Dizler bükük bacak kaldırma',en:'Bent-knee seated leg lifts',type:'reps',key:'bent-knee seated leg lifts',

  {tr:'Tek bacak pike kaldırma',en:'Single-leg seated pike lifts',type:'reps',key:'single-leg seated pike lift',
   how:['Bacaklar önde düz otur, eller dizlerin yanında yerde.','Bir bacağı dizi kilitli tutarak yerden kaldır, 1 sn tut.','İndir, öbür bacak. Gövde öne eğik kalabilir.']},
  {tr:'Oturarak pike bacak kaldırma',en:'Seated pike leg lifts',type:'reps',key:'seated pike leg lifts (pike pulses)',
   how:['Bacaklar düz önde, eller dizlerin yanında yerde.','İki bacağı birden, dizler kilitli, yerden kaldır.','Topuklar birkaç cm kalksın yeter. Geriye yaslanma.']},
  {tr:'Sırt duvarda bacak kaldırma',en:'Wall leg lift-offs (back to wall)',type:'reps',key:'wall L-sit / seated leg lift-offs with back on wall',
   how:['Sırtını duvara daya, bacaklar düz önde.','Elleri kalçanın yanına koy, iki bacağı yerden kaldır, 1 sn tut.','Dizler kilitli, ayak uçları uzanmış. L-sit\'in ısınmasıdır.']},
  {tr:'Eller bileğe yakın kaldırma',en:'Seated pike lifts, hands at ankles',type:'reps',key:'pike lifts hands at ankles',
   how:['Gövde öne eğik, eller ayak bileklerinin yanında.','Bacakları ellerin üstünden kaldır.','En zor versiyon: hamstring esnekliği de gerektirir.']},
  {tr:'Straddle bacak kaldırma',en:'Seated straddle leg lifts',type:'reps',key:'straddle seated leg lifts (pancake lifts)',
   how:['Bacaklar yana açık ve düz otur, eller önde yerde.','İki bacağı birden yerden kaldır.','Dizler tavana baksın. Press için en önemli güç.']},
  {tr:'Asılı diz/bacak kaldırma',en:'Hanging knee / leg raise',type:'reps',key:'hanging leg raise strict',img:'Hanging_Leg_Raise',
   how:['Barda omuzlar aşağı çekili asıl.','Önce dizleri göğse, sonra güçlendikçe düz bacakları yere paralel kaldır.','Sallanma yok; yavaş indir.']},
 ]},
 LSIT:{name:'L-sit',levels:[

  {tr:'Topuklar yerde L-sit',en:'Foot-supported L-sit',type:'hold',key:'foot-supported L-sit',

  {tr:'Ayaklar duvarda L-sit (duvarı it)',en:'Wall-assisted L-sit',type:'hold',key:'L-sit with feet pushing against wall (wall-assisted L-sit)',

  {tr:'Tuck\'tan tek bacak açma',en:'Tuck L-sit alternating extensions',type:'reps',key:'tuck to L-sit leg extensions',

  {tr:'İleri tuck L-sit',en:'Advanced tuck L-sit',type:'hold',key:'advanced tuck L-sit',

  {tr:'Tek bacak L-sit',en:'One-leg L-sit',type:'hold',key:'one-leg L-sit',

  {tr:'Tam L-sit',en:'Full L-sit',type:'hold',key:'full L-sit',
   how:['İki bacak dümdüz, yere paralel.','Omuzlar aşağı, kollar kilitli.','Ayak uçlarını uzat, kalçayı ellerin hizasında tut.']},
 ]},
 PRESS:{name:'Press (L-sit → handstand)',levels:[
  {tr:'Parmak ucuna yuvarlanma',en:'Roll onto toes (tip toe lean)',type:'hold',key:'roll onto toes / tip toe lean',
   how:['Pike duruş: eller yerde, bacaklar düz, kalça yukarıda.','Parmak uçlarına yuvarlan, omuzları bileklerin önüne taşı.','Ağırlık ellere binsin, ayaklar hafiflesin; tut.']},
  {tr:'Ayaklar yüksekte ayak kaldırma',en:'Elevated press lift-offs (box)',type:'reps',key:'elevated feet press lift-offs',

  else if(st.k==='fin'){run.tEnd=run.tEnd||Date.now();const sm=runSummary();
    body=`<p class="done-hero">Bitti 👏</p><p class="en">${d.t} · ${d.name}</p>
    <div class="sum"><div class="box"><h3>Süre</h3><div class="big">${Math.max(1,Math.round((run.tEnd-run.t0)/60000))} dk</div></div><div class="box"><h3>Set</h3><div class="big">${sm.done} / ${sm.tot}</div></div></div>
    ${sm.holds.length?`<div class="box"><h3>Tutuşlar</h3><div class="plain" style="border:0;padding:0">${sm.holds.map(h=>`<div><span>${esc(h[0])}</span><span class="r">${h[1]}</span></div>`).join('')}</div></div>`:''}
    <div class="box"><h3>Bugünün notu (isteğe bağlı)</h3><input type="text" id="runnote" placeholder="Örn. barfiks 4-4-3-3, L-sit rahattı"><div style="margin-top:8px"><button class="btn" data-rsave="1">Kaydet ve kapat</button></div></div>`;}
  else {
    const s=st.s, L=LADDERS[s.lad], n=lvlOf(s), lv=L.levels[n-1], dose=doseOf(s,lv), nS=parseInt((dose.match(/(\d+)\s*×/)||[0,3])[1],10);
    const dn=run.done[s.id]||(run.done[s.id]=Array(nS).fill(false)); const v=vidsOf(lv.key), img=lv.img&&IMGS[lv.img];
    const all=dn.every(Boolean);
    body=`<div><span class="chip" style="color:${REG[s.reg]}">${s.reg}</span></div>
     <div><p class="lvname">${esc(lv.tr)}</p><p class="en">${esc(lv.en)} · seviye ${n}/${L.levels.length}</p></div>
     ${v.length?vidLink(v[0]):mediaHtml(s.lad,n,lv)}
     ${img?`<div class="photos"><figure><img src="${img[0]}" alt=""><figcaption>Başlangıç</figcaption></figure><figure><img src="${img[1]}" alt=""><figcaption>Bitiş</figcaption></figure></div>`:''}
     <div class="box"><h3>Nasıl yapılır</h3><ol class="steps">${lv.how.map(h=>`<li><span>${esc(h)}</span></li>`).join('')}</ol></div>
     ${s.tip?`<p class="note">${esc(s.tip)}</p>`:''}
     <div class="box"><h3>${dose} · dinlenme ${s.rest} sn — bitirdiğin sete dokun</h3><div class="sets bigsets">${dn.map((x,j)=>`<button class="set ${x?'done':''}" data-rset="${j}" aria-pressed="${x}">${j+1}</button>`).join('')}</div>
     <div class="timer" id="timer" style="margin-top:12px">${all?'Hazır':s.rest}</div>
     ${lv.type==='hold'&&!all?`<button class="btn holdbtn ${run.hw&&run.hw.id===s.id?'on':''}" data-rhold="1">${run.hw&&run.hw.id===s.id?'⏹ Bitir · <span id="holdt">0 sn</span>':'⏱ Tutuşu başlat'}</button>`:''}
     ${(run.holds[s.id]||[]).length?`<p class="holds">Tutuşlar: ${run.holds[s.id].map(x=>x+' sn').join(' · ')}</p>`:''}
     ${ruleHtml(n,L,dose)}</div>
     <button class="linkbtn" data-slot="${s.id}">Seviyeyi değiştir / tüm seviyeler ›</button>
     ${nav(i===tot-3?'Son esnemeye geç →':'Sonraki hareket →',all)}`;
  }
  const y=el.scrollTop; el.innerHTML=`<div class="wrap">${head}${body}</div>`; el.scrollTop=keep?y:0;
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-run],[data-runx],[data-rprev],[data-rnext],[data-rset],[data-rsave],[data-rhold]'); if(!t) return;
  if(t.dataset.rhold){const s=run.steps[run.i].s;
    if(!run.hw){stopT();run.hw={id:s.id,t:Date.now()};drawRun(true);return;}
    const sec=Math.round((Date.now()-run.hw.t)/1000);run.hw=null;(run.holds[s.id]=run.holds[s.id]||[]).push(sec);
    const dn=run.done[s.id],j=dn.indexOf(false);if(j>=0)dn[j]=true;drawRun(true);
    if(dn.every(Boolean)){const e=$('#timer');e.textContent='Hazır';e.classList.add('end');}else startT(s.rest);return;}
  if(t.dataset.run){startRun(t.dataset.run);return;}
  if(t.dataset.runx){endRun();render(false);return;}
  if(t.dataset.rprev){stopT();run.hw=null;run.i=Math.max(0,run.i-1);drawRun();return;}
  if(t.dataset.rnext){stopT();run.hw=null;run.i=Math.min(run.steps.length-1,run.i+1);drawRun();return;}
  if(t.dataset.rset){const s=run.steps[run.i].s,dn=run.done[s.id],j=+t.dataset.rset;dn[j]=!dn[j];
    t.classList.toggle('done',dn[j]);t.setAttribute('aria-pressed',dn[j]);
    if(dn.every(Boolean)){stopT();const e=$('#timer');e.textContent='Hazır';e.classList.add('end');const nb=document.querySelector('[data-rnext]');if(nb)nb.style.opacity='';}
    else if(dn[j]) startT(s.rest); return;}
  if(t.dataset.rsave){const txt=($('#runnote').value||'').trim(),sm=runSummary(),mins=Math.max(1,Math.round((run.tEnd-run.t0)/60000));
    const auto=[mins+' dk',sm.done+'/'+sm.tot+' set',...sm.holds.map(h=>h[0]+' '+h[1])].join(' · ');
    state.log.unshift({ts:Date.now(),dayId:run.d.id,date:new Date().toLocaleDateString('tr-TR'),day:run.d.t,ex:run.d.t+' antrenmanı tamamlandı',note:auto+(txt?' — '+txt:'')});state.log=state.log.slice(0,300);persist();
    endRun();render();return;}
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){cur=h;render();}});
render();
</script>
